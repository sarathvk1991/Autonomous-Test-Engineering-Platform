# SUT / environment binding (ADR-0037 D3): resolved ONLY from this file or a matching
# -Denv.<key> system property override. The requirement source never contributes these.
# Distinguished in code, not just by prefix -- see ConfigReader.env(String).
env.browser=chrome
env.headless=false
env.base.url=https://www.saucedemo.com
env.implicit.wait=10
env.explicit.wait=60

# Test data (fixture only -- a public demo site's own well-known login, not a real secret).
# data.username / data.password support env-var override (TEST_DATA_USERNAME /
# TEST_DATA_PASSWORD) so the indirection pattern for real credentials exists from day one.
# See ConfigReader.data(String).
data.username=standard_user
data.password=secret_sauce
