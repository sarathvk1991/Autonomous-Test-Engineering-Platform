# Cucumber configuration for the JUnit Platform Suite runner (ADR-0041 D3).
# Lives here, not in @ConfigurationParameter on the runner, because Layer 3 rewrites glue
# as it generates step definitions -- a properties-file edit, never a tracked-source edit.

# Glue: packages Cucumber scans for step definitions and lifecycle hooks.
cucumber.glue=com.automation.steps,com.automation.base

# Matches the POC's default filter: in-progress scenarios never block a run.
cucumber.filter.tags=not @wip

# ADR-0041 D6: message: (Cucumber Messages NDJSON) is the Layer 6 input contract -- the
# machine-readable format Failure Intelligence & Self-Healing parses. junit: keeps Jenkins
# trend rendering. html: is for humans. rerun: is a convenience.
#
# Deliberately NOT configured: json: -- the reporter message: replaces. The POC's own
# RunCucumberTest.java (docs/reference/automation-poc/) still configures json:; this baseline
# drops it so Layer 6 has exactly one machine-readable format to parse, per D6's binding
# constraint ("must never parse the HTML or XML reports").
cucumber.plugin=message:target/cucumber-reports/messages.ndjson,\
  junit:target/cucumber-reports/cucumber.xml,\
  html:target/cucumber-reports/report.html,\
  rerun:target/cucumber-reports/rerun.txt

# Snippet style: camelCase matches Java method naming, so generated snippets paste cleanly.
cucumber.snippet-type=camelcase

# Not enabled yet (ADR-0041 D5) -- but the driver design (ThreadLocal, constructor-injected
# page objects) is parallel-safe regardless, so flipping this on later needs no rework here.
# cucumber.execution.parallel.enabled=true
